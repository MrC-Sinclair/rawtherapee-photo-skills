# 合并配置文件 — 单 skill 模式下所有脚本共用
# 每个脚本在找不到自己子目录的 config.toml 时，会自动读取本文件。

# ── 公共配置 ─────────────────────────────────────────────────

# 原始照片目录（RAW/JPG/HEIC 文件所在路径）
# toolkit 和 grader 都会读取此字段
raw_dir = ""

# 处理结果输出目录
# toolkit 输出缩略图、grader 输出调色后的 JPG 到此目录
output_dir = ""

# 输出 JPEG 画质 (1-100)
# toolkit 缩略图建议 85，grader 调色输出建议 95
# 合并模式下取 95（高质量），toolkit 可通过 --quality 85 覆盖
jpeg_quality = 95

# 输出图片最大边长（像素），超过此尺寸会等比缩小
# 设为 0 表示保持原始分辨率（grader 调色时建议 0 或传 --no-resize）
max_size = 1200

# 是否递归搜索子目录中的照片（相机上传通常是多层目录，建议开启）
recursive = true

# 是否覆盖已存在的输出文件
overwrite = false

# 是否保留原始照片的 EXIF 元数据（拍摄参数、GPS 等）
preserve_exif = true

# 并行工作进程数，0 = 自动（取 CPU 核数，最多 8）
workers = 0

# ── photo-toolkit 专用 ────────────────────────────────────

# LLM 视觉输入的总大小预算（MB）
# 小于 (预算 / 照片数) 的 JPG/HEIC 文件将直接软链接而非重新编码
# 设为 0 禁用此优化
thumbnail_budget_mb = 50

# ── photo-grader 专用 ───────────────────────────────────────
# grader 调色时建议通过 CLI 传 --no-resize 保持全尺寸输出
# jpeg_quality = 95 (已在公共配置中设置，与 grader 默认值一致)

# RawTherapee CLI 路径（空字符串自动从 PATH 查找 rawtherapee-cli）
rawtherapee_cli = ""

# 快速导出模式 (-f)：跳过不需要的处理模块加速渲染
fast_export = false

# 输出位深：8 或 16 (TIFF/PNG 有效；JPEG 固定 8-bit)
output_bpp = 8

# 是否启用镜头校正 (lensfun)
lens_correction = true

# 是否使用 Auto-Matched Camera Profile (匹配机内 JPEG 风格)
auto_matched_curve = true

# ── photo-previewer 专用 ───────────────────────────────────
# 交互式浏览器预览服务器（preview.py）。所有字段可留空/0 = 用内置默认值。
# 注意：脚本读的是顶层裸键（不要包一层 [previewer] 段）。

# HTTP 服务绑定端口。0 = 由操作系统分配空闲端口（推荐；反代场景 /preview/<port>/* 指向它）。
# 需要给 nginx upstream 固定端口时再写死。CLI --port 优先于本字段。
port = 0

# 对用户展示的最终 URL（启动时打印、转发给用户）。
# preview.py 自身只 bind 127.0.0.1，暴露到公网是部署方的事（nginx / 网关 / k8s ingress
# 把 /preview/* 反代到 http://127.0.0.1:<port>/）。示例：
#   external_url = "https://your-domain.com/preview/"
# 留空则回退打印内部 http://127.0.0.1:<port>/（仅本地调试）。CLI --external-url 优先。
external_url = ""
